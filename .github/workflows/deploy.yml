
name: Deploy VinhaSense Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Configurar SSH
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key
          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

      - name: Publicar na Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/azure_key" \
            dist/ \
            "$AZURE_USER@$AZURE_HOST:/var/www/parreiral/"
